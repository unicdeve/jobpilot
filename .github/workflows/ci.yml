# Checks every change on the three platforms JobPilot ships for (ADR-0029 §8).
#
# Linux runs `make check`, which already vets and lints the Go code as every
# platform. macOS and Windows run the tests, which is what only a real
# machine of each can do. The desktop is built, linted and tested on all
# three, since its Rust differs per platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    name: Go checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  go-test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      # The race detector needs cgo, which a Windows runner has no compiler
      # for; races are caught on Linux and macOS.
      - name: Integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test -tags=integration ./...
          else
            go test -race -tags=integration ./...
          fi

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Type-checks the frontend, and writes the dist/ that the Rust build
      # embeds and cannot compile without.
      - run: bun run build
      # Installs the toolchain rust-toolchain.toml pins.
      - name: Rust toolchain
        working-directory: desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: rustfmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked
